services:
  mongo:
    image: mongo:7
    container_name: zevora-mongo
    command: ["--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - zevora_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zevora_mongo_data:
